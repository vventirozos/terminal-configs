# Tokyo Night (Night) for Midnight Commander, on a black background.
# Needs a true-colour terminal (COLORTERM=truecolor, set in ~/.zshrc).

[skin]
    description = Tokyo Night on black
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ╭
    drighttop = ╮
    dleftbottom = ╰
    drightbottom = ╯
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[aliases]
    Main = #000000
    MainFg = #c0caf5
    PaleFg = #565f89
    Selected = #283457
    MarkedFg = #e0af68
    HeaderFg = #7aa2f7
    Dialog = #16161e
    DialogFocus = #3d59a1
    Input = #292e42
    Error = #3b1219
    ErrorFocus = #db4b4b
    Bar = #16161e
    Accent = #7aa2f7

[core]
    _default_ = MainFg;Main
    selected = MainFg;Selected
    marked = MarkedFg;;bold
    markselect = MarkedFg;Selected;bold
    gauge = #000000;Accent
    input = MainFg;Input
    inputunchanged = PaleFg;Input
    inputmark = #000000;Accent
    disabled = PaleFg;Dialog
    reverse = #000000;Accent
    commandlinemark = #000000;Accent
    header = HeaderFg;;bold
    shadow = PaleFg;#000000

[dialog]
    _default_ = MainFg;Dialog
    dfocus = #ffffff;DialogFocus
    dhotnormal = #ff9e64;Dialog
    dhotfocus = #ff9e64;DialogFocus
    dtitle = Accent;Dialog;bold

[error]
    _default_ = #f7768e;Error
    errdfocus = #ffffff;ErrorFocus
    errdhotnormal = #e0af68;Error
    errdhotfocus = #e0af68;ErrorFocus
    errdtitle = #f7768e;Error;bold

[filehighlight]
    directory = #0087d7
    executable = #9ece6a
    symlink = #d700d7
    hardlink =
    stalelink = #ff007c
    device = #e0af68
    special = #9d7cd8
    core = #db4b4b
    temp = #737aa2
    archive = #ff9e64
    doc = #a9b1d6
    source = #bb9af7
    media = #73daca
    graph = #89ddff
    database = #2ac3de

[menu]
    _default_ = MainFg;Bar
    menusel = #000000;Accent
    menuhot = #ff9e64;Bar
    menuhotsel = #000000;Accent;bold
    menuinactive = PaleFg;Bar

[popupmenu]
    _default_ = MainFg;Dialog
    menusel = #ffffff;DialogFocus
    menutitle = Accent;Dialog;bold

[buttonbar]
    hotkey = Accent;Main
    button = MainFg;Selected

[statusbar]
    _default_ = PaleFg;Bar

[help]
    _default_ = MainFg;Dialog
    helpbold = #e0af68;;bold
    helpitalic = #bb9af7;;italic
    helplink = #7dcfff;;underline
    helpslink = #000000;#7dcfff

[editor]
    _default_ = MainFg;Main
    editbold = #e0af68;;bold
    editmarked = ;Selected
    editwhitespace = #292e42;Main
    editnonprintable = #f7768e;Main
    editlinestate = PaleFg;Bar
    bookmark = #000000;#e0af68
    bookmarkfound = #000000;#9ece6a
    editrightmargin = #292e42;Main
    editbg = PaleFg;Main
    editframe = PaleFg
    editframeactive = Accent
    editframedrag = #ff9e64

[viewer]
    _default_ = MainFg;Main
    viewbold = #e0af68;;bold
    viewunderline = #7dcfff;;underline
    viewselected = #000000;#e0af68

[diffviewer]
    added = #000000;#9ece6a
    changedline = MainFg;Selected
    changednew = #000000;#73daca
    changed = #000000;#e0af68
    removed = #000000;#f7768e
    error = #f7768e;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
