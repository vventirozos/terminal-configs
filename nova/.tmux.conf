# ============================================================
#  ~/.tmux.conf
# ============================================================

# --- Prefix: C-q instead of C-b ---
unbind C-a
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# --- Core behavior ---
set -g history-limit 100000          # deep scrollback for log tailing
set -g mouse on                      # click to focus panes, drag borders, wheel scroll
set -s escape-time 0                 # no delay after ESC (vim)
set -g base-index 1                  # windows start at 1
setw -g pane-base-index 1            # panes start at 1
set -g renumber-windows on           # keep window numbers gapless
set -g detach-on-destroy off         # on kill-session, jump to another session
set -g allow-rename off              # don't let programs rename windows
setw -g automatic-rename on          # ...tmux names each window after its current folder
set -g automatic-rename-format '#{b:pane_current_path}'

# --- True color / terminfo ---
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# --- Splits: | and -, opening in the current pane's directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation: Option+Shift+arrows, no prefix needed ---
# (plain Option+arrows are left to the shell: word motions in zsh)
bind -n M-S-Left  select-pane -L
bind -n M-S-Right select-pane -R
bind -n M-S-Up    select-pane -U
bind -n M-S-Down  select-pane -D

# --- Window switching: Ctrl+Option+arrows, no prefix ---
# (plain Ctrl+arrows are eaten by macOS Mission Control's space-switching
# shortcuts; they work too if you disable those in System Settings)
bind -n C-M-Left  previous-window
bind -n C-M-Right next-window
# bind -n C-Left    previous-window
# bind -n C-Right   next-window

# --- Broadcast typing to all panes in the window (toggle) ---
bind S setw synchronize-panes \; display "sync: #{?synchronize-panes,ON,off}"

# --- Copy mode: vi keys, copies go to the macOS clipboard (OSC 52) ---
setw -g mode-keys vi
set  -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Mouse selection: copy on mark ---
# Release the drag: copy to macOS clipboard and return straight to the live
# view (staying in copy mode would park a cursor at the end of the selection)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# Single click while scrolled back: clear the highlight
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection
# Double-click = select+copy word, triple-click = select+copy line
# (the 0.3s delay before the copy is how tmux's own defaults do it: the
# selection gets a moment to settle and you see the highlight flash)
bind -n  DoubleClick1Pane select-pane -t = \; copy-mode -M \; send -X -t = select-word \; run -d 0.3 \; send -X -t = copy-pipe-and-cancel "pbcopy"
bind -n  TripleClick1Pane select-pane -t = \; copy-mode -M \; send -X -t = select-line \; run -d 0.3 \; send -X -t = copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane select-pane -t = \; send -X -t = select-word \; run -d 0.3 \; send -X -t = copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane -t = \; send -X -t = select-line \; run -d 0.3 \; send -X -t = copy-pipe-and-cancel "pbcopy"

# Clicks are never forwarded to the app in the pane (stops apps like ghost
# from moving their cursor on click) — left click only focuses the pane,
# drag always marks text, middle-click pastes the macOS clipboard
bind -n MouseDown1Pane select-pane -t =
bind -n MouseDrag1Pane copy-mode -M
bind -n MouseDown2Pane select-pane -t = \; run "pbpaste | tmux load-buffer -" \; paste-buffer
# Button RELEASES must be bound too — unbound mouse events are forwarded to
# mouse-aware apps, and prompt_toolkit places its cursor on mouse-up
bind -n MouseUp1Pane select-pane -t =
bind -n MouseUp2Pane select-pane -t =
bind -n MouseUp3Pane select-pane -t =
# Right-click also pastes (trackpads have no middle button); the pane
# context menu is still available on Option+right-click
bind -n MouseDown3Pane select-pane -t = \; run "pbpaste | tmux load-buffer -" \; paste-buffer

# --- Quick floating scratch terminal ---
bind ! display-popup -E -w 80% -h 75%

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "config reloaded"

# ============================================================
#  DESIGN TWEAKS
# ============================================================

# Don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ============================================================
#  COLOUR (Tokyo Night; nova's accent colour is #bb9af7)
# ============================================================

# Statusbar — at the top: session "pill", window list, date and time, prefix indicator
set -g status-position top
set -g status-style fg=#737aa2,bg=default
set -g status-left-length 40
set -g status-left '#[fg=#bb9af7]#[fg=#000000,bg=#bb9af7,bold] #S #[fg=#bb9af7,bg=default,nobold] '
set -g status-right '#[fg=#737aa2]%Y-%m-%d %H:%M #{?client_prefix,#[fg=#000000 bg=#9ece6a]  ●  ,#[fg=#414868]  ○  }#[default] '

# Window titles — the current one is highlighted
setw -g window-status-separator ''
setw -g window-status-style fg=#737aa2,bg=default
setw -g window-status-format ' #I #W '
setw -g window-status-current-format '#[fg=#c0caf5,bg=#283457,bold] #I #W #[default]'

# Hide the status bar while a session has a single window.
# Note: tmux-continuum autosaves from the status bar, so it only saves while the
# bar is visible in some session. Delete these three lines to always show it.
set-hook -g session-created  'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g window-linked    'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g window-unlinked  'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'

# Pane borders — the active pane gets the accent
set -g pane-border-style fg=#292e42
set -g pane-active-border-style fg=#bb9af7

# Popups (session picker): rounded border
set -g popup-border-lines rounded
set -g popup-border-style fg=#bb9af7

# Message text and copy-mode selection
set -g message-style fg=#bb9af7,bg=#16161e
setw -g mode-style fg=#c0caf5,bg=#283457

# Pane number display
set -g display-panes-active-colour '#bb9af7'
set -g display-panes-colour '#ff9e64'

# Clock
setw -g clock-mode-colour '#9ece6a'

# Bell
setw -g window-status-bell-style fg=#000000,bg=#f7768e

# Passthrough 
set -g allow-passthrough on

# --- PageUp / PageDown: scroll back through tmux history one page at a time ---
# The first PageUp enters copy mode; paging back down to the bottom leaves it.
# Full-screen programs (less, vim, mc) still receive the keys themselves.
# (Shift+PageUp/PageDown scroll Ghostty's own scrollback instead.)
bind -n PPage if -F "#{alternate_on}" "send-keys PPage" "copy-mode -eu"

# ============================================================
#  QoL additions 2026-11-18 (same as evolmonkey and eva)
# ============================================================
set -g focus-events on               # vim autoread, focus-aware programs
set -g extended-keys on              # Shift+Enter and other modified keys reach programs
set -g allow-passthrough on          # images / OSC sequences pass through to the terminal
set -g display-time 2000             # messages stay 2 s
setw -g aggressive-resize on         # size a window to the clients looking at it
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:usstyle:extkeys"

# Pane resizing: prefix then H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Session picker (fuzzy)
bind s display-popup -E -w 50% -h 50% "tmux ls | /opt/homebrew/bin/fzf --reverse | cut -d: -f1 | xargs -I{} tmux switch-client -t {}"

# (the session name "pill" on the left is set in the COLOUR section above)

# Plugins (tpm) — prefix + I installs, prefix + U updates
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # prefix + Ctrl-s save, prefix + Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'    # saves every 15 min, restores when tmux starts
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Keep this line last
run '~/.tmux/plugins/tpm/tpm'
